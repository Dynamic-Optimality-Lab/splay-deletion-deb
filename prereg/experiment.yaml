criticality:
  distinguish_transient_and_cyclic: true
  zero_slack_at_optimum_is_primary: true
mining:
  forced_derivatives_before_scalar_regression: true
  state_history_features_allowed_only_as_diagnostic: true
  final_H_must_be_state_only: true
verification:
  require_upper_certificate: true
